name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-zig:
    name: Build ${{ matrix.name }} with Zig
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            target: x86_64-unknown-linux-musl
            rust_target: x86_64-unknown-linux-musl
            binary: gh-proxy
          - name: linux-aarch64
            target: aarch64-unknown-linux-musl
            rust_target: aarch64-unknown-linux-musl
            binary: gh-proxy
          - name: linux-riscv64
            target: riscv64gc-unknown-linux-musl
            rust_target: riscv64gc-unknown-linux-musl
            binary: gh-proxy
          - name: linux-powerpc64le
            target: powerpc64le-unknown-linux-musl
            rust_target: powerpc64le-unknown-linux-musl
            binary: gh-proxy
          - name: windows-x86_64
            target: x86_64-pc-windows-gnu
            rust_target: x86_64-pc-windows-gnu
            binary: gh-proxy.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - uses: ilammy/setup-nasm@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust_target }}
      - name: Build
        run: cargo zigbuild --locked --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.rust_target }}/release/${{ matrix.binary }}" "dist/${{ matrix.binary }}"
          tar -C dist -czf "gh-proxy-${{ github.ref_name }}-${{ matrix.name }}.tar.gz" "${{ matrix.binary }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            gh-proxy-${{ github.ref_name }}-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-apple-darwin
          - arch: aarch64
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/gh-proxy" dist/gh-proxy
          tar -C dist -czf "gh-proxy-${{ github.ref_name }}-macos-${{ matrix.arch }}.tar.gz" gh-proxy
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            gh-proxy-${{ github.ref_name }}-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish Release
    needs:
      - build-zig
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate release notes
        shell: bash
        run: |
          base_url="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          cat > RELEASE_NOTES.md <<EOF
          ## Quick downloads

          ### Linux
          - [x86_64](${base_url}/gh-proxy-${{ github.ref_name }}-linux-x86_64.tar.gz)
          - [ARM64](${base_url}/gh-proxy-${{ github.ref_name }}-linux-aarch64.tar.gz)

          ### macOS
          - [Apple Silicon](${base_url}/gh-proxy-${{ github.ref_name }}-macos-aarch64.tar.gz)
          - [Intel](${base_url}/gh-proxy-${{ github.ref_name }}-macos-x86_64.tar.gz)

          ### Windows
          - [x86_64](${base_url}/gh-proxy-${{ github.ref_name }}-windows-x86_64.tar.gz)

          Other supported architectures are available in the assets below. GitHub displays each asset's SHA-256 digest.
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: artifacts/*

  container:
    name: Publish Container Image
    needs: build-zig
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: artifacts/linux-x86_64
      - uses: actions/download-artifact@v4
        with:
          name: linux-aarch64
          path: artifacts/linux-aarch64
      - name: Prepare container binaries
        shell: bash
        run: |
          mkdir -p dist/amd64 dist/arm64
          tar -xzf artifacts/linux-x86_64/gh-proxy-${{ github.ref_name }}-linux-x86_64.tar.gz -C dist/amd64
          tar -xzf artifacts/linux-aarch64/gh-proxy-${{ github.ref_name }}-linux-aarch64.tar.gz -C dist/arm64
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
